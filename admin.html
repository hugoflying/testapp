function syncHead(){ const h = document.querySelector('.split .card.tw h2'); if(h && AL(sel).types[ty].steps) h.innerHTML = sel + ' ' + esc(ty) + ' : étapes et cibles'; }
function ganttHTML(st, mtt, cls){
  const abs = p => p[0] === 'AIBT' ? -mtt + p[1] : p[1];   // minutes par rapport à EOBT
  const lo = Math.min(-mtt - 5, ...st.map(s => abs(s.a)), ...st.filter(s => s.b).map(s => abs(s.b))) - 2;
  const hi = Math.max(5, ...st.map(s => abs(s.b || s.a)) .map(v => v + 3)), Wd = hi - lo, pc = m => ((m - lo) / Wd * 100).toFixed(2) + '%';
  return {abs, lo, hi, Wd, pc};
}
function drawGantt(){
  const g = $('#gantt'); if(!g) return;
  const a = AL(sel), x = a.types[ty], st = stepsOf(a,ty) || [], mtt = x.mtt || 30;
  const {abs, lo, hi, Wd, pc} = ganttHTML(st, mtt);
  let ax = ''; for(let m = Math.ceil(lo / 10) * 10; m <= hi; m += 10) ax += '<span style="left:' + pc(m) + '">' + (m === 0 ? 'EOBT' : m) + '</span>';
  let h = '<div class="gx">' + ax + '</div>';
  st.forEach(s => {
    const s0 = abs(s.a), s1 = s.b ? abs(s.b) : s0, bad = s.b && s1 < s0;
    h += '<div class="gr"><div class="gl" title="' + esc(STEPS[s.k] || s.k) + '">' + esc(STEPS[s.k] || s.k) + '</div><div class="gt"><span class="gline" style="left:' + pc(-mtt) + '"></span><span class="gline e" style="left:' + pc(0) + '"></span><span class="gb' + (s.b ? '' : ' pt') + '" style="left:' + pc(Math.min(s0,s1)) + ';width:' + (Math.abs(s1 - s0) / Wd * 100).toFixed(2) + '%' + (bad ? ';background:var(--bad)' : '') + '"></span></div></div>';
  });
  h += '<div class="gr"><div class="gl"></div><div class="gt"><span class="gcap" style="left:' + pc(-mtt) + ';color:var(--muted)">AIBT</span><span class="gcap" style="left:' + pc(0) + ';color:var(--bad)">EOBT</span></div></div>';
  if(st.some(s => s.b && abs(s.b) < abs(s.a))) h += '<div class="hint" style="padding:6px 0 0;color:var(--bad)">Une étape finit avant de commencer (en rouge).</div>';
  g.innerHTML = h;
}

function saveW(){ if($('#wc')){ W.c = $('#wc').value.toUpperCase().trim(); W.icao = $('#wi').value.toUpperCase().trim(); W.n = $('#wn').value.trim(); } }
function next(){

/* Codes retard par compagnie (v3.37) : liste du manuel (dlcodes.js), « comme » une autre compagnie, ou liste propre */
let DLC = null, dlQ = '';
const DL_ALIAS = c => ({ FR:'FR', RK:'FR', W4:'W4', W6:'W4', H4:'H4', H6:'H4', V7:'V7' })[c] || 'H4';
const DL_NAME = { FR:'Ryanair', W4:'Wizz Air', H4:'HiSky', V7:'Volotea' };
function dlBase(c){ const a = AL(c), k = DL_ALIAS((a && a.dlLike) || c); return (DLC && DLC[k]) || {src:'', codes:[]}; }
function dlEff(c){ const a = AL(c); if(a.dl) return a.dl; if(a.dlLike && AL(a.dlLike) && AL(a.dlLike).dl) return AL(a.dlLike).dl; return dlBase(c); }
function dlMode(v){
  const a = AL(sel);
  if(v === '__own'){ a.dl = clone(dlEff(sel)); a.dl.src = 'Liste ' + sel + ' modifiée dans l\'admin'; delete a.dlLike; }
  else if(v === '__base'){ delete a.dl; delete a.dlLike; }
  else { delete a.dl; a.dlLike = v; }
  save(); render();
}
function dlOwn(){ const a = AL(sel); if(!a.dl){ a.dl = clone(dlEff(sel)); a.dl.src = 'Liste ' + sel + ' modifiée dans l\'admin'; delete a.dlLike; } return a.dl.codes; }
function dlSet(i, j, el){ const c = dlOwn(); c[i][j] = j === 0 ? el.value.toUpperCase().trim() : el.value; el.classList.add('ch'); save(); syncDlHead(); }
function dlDel(i){ dlOwn().splice(i, 1); save(); render(); }
function dlAdd(){ dlOwn().unshift(['', '', '']); dlQ = ''; save(); render(); const f = document.querySelector('.dlt input'); if(f) f.focus(); }
function syncDlHead(){ const e = $('#dlMode'); if(e && e.value !== '__own'){ e.value = '__own'; } }
function tDl(a){
  if(!DLC) return '<div class="card"><div class="hint" style="padding-top:14px">Chargement des listes…</div></div>';
  const L = dlEff(sel), base = DL_ALIAS(a.dlLike || sel), baseName = DL_ALIAS(sel) === 'H4' && !['H4','H6'].includes(sel) ? 'IATA générique' : DL_NAME[DL_ALIAS(sel)];
  const others = Object.keys(C.al).filter(c => c !== sel);
  const opt = '<option value="__base"' + (!a.dl && !a.dlLike ? ' selected' : '') + '>Liste du manuel (' + baseName + ')</option>'
    + others.map(c => '<option value="' + c + '"' + (a.dlLike === c ? ' selected' : '') + '>Comme ' + c + '</option>').join('')
    + '<option value="__own"' + (a.dl ? ' selected' : '') + '>Liste propre à ' + sel + '</option>';
  const q = dlQ.trim().toLowerCase();
  const rows = (L.codes || []).map((r, i) => [r, i]).filter(([r]) => !q || r.join(' ').toLowerCase().includes(q));
  const shown = rows.slice(0, 400);
  const tr = shown.map(([r, i]) => '<tr style="cursor:default"><td><input class="mini" style="width:64px" value="' + esc(r[0]) + '" oninput="dlSet(' + i + ',0,this)"></td><td><input class="txt" value="' + esc(r[1]) + '" oninput="dlSet(' + i + ',1,this)"></td><td><input class="txt" value="' + esc(r[2] || '') + '" oninput="dlSet(' + i + ',2,this)"></td><td><button class="btn d" type="button" aria-label="Retirer" onclick="dlDel(' + i + ')">×</button></td></tr>').join('');
  return '<div class="card"><div class="form"><div class="row2"><div class="f"><label>Liste utilisée par l\'app pour ' + sel + '</label><select id="dlMode" onchange="dlMode(this.value)">' + opt + '</select><small>' + esc(L.src || '') + ' · ' + (L.codes || []).length + ' codes. Modifier un code crée une liste propre à ' + sel + '.</small></div>'
   + '<div class="f"><label>Chercher</label><input value="' + esc(dlQ) + '" placeholder="81, météo, bag…" oninput="dlQ=this.value;clearTimeout(window._dlT);window._dlT=setTimeout(()=>{render();const f=document.querySelector(\'.form .row2 .f:nth-child(2) input\');if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length);}},250)"></div></div>'
   + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip add" type="button" onclick="dlAdd()">+ Ajouter un code</button></div></div>'
   + '<div class="tw"><table class="dlt"><thead><tr><th>Code</th><th>Libellé</th><th>Précision</th><th></th></tr></thead><tbody>' + tr + '</tbody></table></div>'
   + (rows.length > shown.length ? '<div class="hint" style="padding-top:10px">' + (rows.length - shown.length) + ' codes de plus : affinez la recherche.</div>' : '')
   + '<div class="hint" style="padding-top:10px">Les codes automatiques de l\'app (93, 81, 89…) ne changent pas : cette liste sert aux suggestions et au bouton « Liste » de l\'onglet Retard.</div></div>';
}

/* Vols de démo (v3.39) : scénario rejoué au lancement de la démo et par « Réinitialiser » */
const DF0 = [['FR','594','595','OPO','EIDCL','B38M','4',25,''],['W4','5148','5149','TIA','9HWAU','A321','12',35,'S3'],['FR','1037','1038','VIE','9HLOA','A320','7',25,'S2'],
  ['FR','3016','3017','PMI','EIEVA','B738','2',25,''],['FR','2961','2962','OTP','EIIGR','B38M','5',25,''],['FR','2853','2854','VNO','EIFZD','B738','9',25,''],
  ['FR','1179','1180','BHX','EIDWB','B738','3',25,''],['W4','3061','3062','TSR','9HWBY','A320','11',35,''],['W4','3065','3066','CLJ','9HWDA','A21N','14',35,''],
  ['W4','3233','3234','IAS','9HWAV','A320','10',35,''],['W4','3027','3028','OTP','9HWXA','A21N','13',35,'']];
const DX0 = [['FR','8338','8339','RAK','EIEFB','B738','6',25],['FR','6512','6513','NAP','EIIHD','B38M','3',25],['V7','2104','2105','BIA','EIFNH','A319','8',40],
  ['W4','3381','3382','SKP','9HWNC','A321','12',35],['FR','4721','4722','FEZ','EIDPW','B738','1',25],['H4','2379','2380','AGA','9HHAB','A320','9',45]];
function demoDefault(){
  const S0 = {0:{sibt:-15},1:{sibt:1,ctot:20},2:{sibt:10,ctot:28}}, SC = {3:'late',5:'89-77',6:'ctot',7:'ctot',8:'ctot'}, out = [];
  const mk = (r, open, sibt, extra) => Object.assign({open, cie:r[0], arr:r[1], dep:r[2], ap:r[3], reg:r[4], type:r[5], park:r[6], tat:r[7], paf:r[8] || '', sibt:String(sibt), aibt:'', sobt:'', ctot:'', aobt:'', fill:'auto', dl:'', cx:false}, extra || {});
  DF0.forEach((r, i) => {
    const o = S0[i], sc = SC[i] || 'ok', sibt = o ? o.sibt : -150 + i*17, D = sibt + r[7], A = sc === 'late' ? sibt + 14 : sibt - 2;
    const mt = r[0] === 'FR' ? 25 : r[0] === 'W4' ? 30 : r[7], eobt = Math.max(D, A + mt), x = {};
    if(sc === 'late'){ x.aibt = String(A); x.aobt = String(eobt + 4); x.dl = '32 4'; }
    if(sc === '89-77'){ x.aobt = String(D + 10); x.dl = '89 6, 77 4'; }
    if(o && o.ctot != null) x.ctot = String(D + o.ctot); else if(sc === 'ctot') x.ctot = String(D + (i === 6 ? 20 : i === 7 ? 33 : 27));
    out.push(mk(r, i < 3, sibt, x));
  });
  DX0.forEach((r, k) => out.push(mk(r, false, 25 + k*28, {cx: k === 4})));
  return out;
}
const dfl = () => (C.demo && C.demo.flights) || null;
function dEdit(){ if(!C.demo || !C.demo.flights) C.demo = {flights: demoDefault()}; return C.demo.flights; }
function dSet(i, k, v){ dEdit()[i][k] = v; save(); if(['open','fill','cx'].includes(k)) render(); else dSync(i); }
function dAdd(){ const f = dEdit(); f.push({open:true, cie:'FR', arr:'', dep:'', ap:'', reg:'', type:'B738', park:'', tat:25, paf:'', sibt:'-10', aibt:'', sobt:'', ctot:'', aobt:'', fill:'auto', dl:'', cx:false}); save(); render(); }
function dDel(i){ if(!confirm('Retirer ce vol du scénario ?')) return; dEdit().splice(i, 1); save(); render(); }
function dMove(i, d){ const f = dEdit(), j = i + d; if(j < 0 || j >= f.length) return; [f[i], f[j]] = [f[j], f[i]]; save(); render(); }
function dReset(){ if(!confirm('Revenir au scénario par défaut ?')) return; delete C.demo; save(); render(); }
// Aperçu des heures si la démo était lancée maintenant (même calcul que l'app)
function dRel(v){ v = String(v ?? '').trim().replace(/[−–]/g, '-'); if(!v) return null; if(/^(non|x|pas encore)$/i.test(v)) return 'non';
  const m = /^(\d{1,2})[:h](\d{2})$/.exec(v); if(m){ const t = new Date(); t.setHours(+m[1], +m[2], 0, 0); let r = Math.round((t - Date.now()) / 60000); if(r > 720) r -= 1440; if(r < -720) r += 1440; return r; }
  const n = parseInt(v, 10); return isNaN(n) ? NaN : n; }
function dCalc(f, i){
  const num = (v, d) => (v === null || v === 'non') ? d : v, tat = +f.tat || 30;
  const sibt = num(dRel(f.sibt), -60 + i*20), D = num(dRel(f.sobt), sibt + tat), a = dRel(f.aibt), A = a === 'non' ? Math.max(sibt, 5) : num(a, sibt - 2);
  const mt = ['FR','RK'].includes(f.cie) ? 25 : ['W4','W6'].includes(f.cie) ? 30 : tat, eobt = Math.max(D, A + mt);
  const c = dRel(f.ctot), ctot = typeof c === 'number' ? c : null, o = dRel(f.aobt);
  let off = typeof o === 'number' ? o : (ctot != null ? Math.max(eobt, ctot - 12) : eobt - 1); if(o === 'non') off = Math.max(off, 5);
  return {sibt, A, D, ctot, off, eobt, bad: [sibt, D, A, off].some(x => typeof x === 'number' && isNaN(x))};
}
function dLine(f, i){
  const c = dCalc(f, i), hm = m => { const d = new Date(Date.now() + m*60000); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
  if(c.bad) return '<span style="color:var(--bad)">Une heure n\'est pas comprise : utilisez -20, +15, 10:35 ou non.</span>';
  const st = c.off <= 0 ? 'parti' : c.A <= 0 ? 'au sol' : 'pas encore arrivé';
  return 'Lancée maintenant : SIBT ' + hm(c.sibt) + ' · AIBT ' + hm(c.A) + ' · SOBT ' + hm(c.D) + (c.ctot != null ? ' · CTOT ' + hm(c.ctot) : '') + ' · AOBT ' + hm(c.off) + ' → <b>' + st + '</b>';
}
function dSync(i){ const el = document.getElementById('dl-' + i); if(el) el.innerHTML = dLine(dfl()[i], i); }
function vDemo(){
  const fl = dfl() || demoDefault(), own = !!dfl();
  const inp = (i, k, lbl, w, ph) => '<div class="f"><label>' + lbl + '</label><input class="txt" style="min-width:0' + (w ? ';max-width:' + w + 'px' : '') + '" value="' + esc(fl[i][k] ?? '') + '" placeholder="' + (ph || '') + '" oninput="dSet(' + i + ',\'' + k + '\',this.value)"></div>';
  const cards = fl.map((f, i) => '<div class="card dcard"><div class="dhd"><span class="code">' + esc(f.cie || '?') + '</span><b>' + esc((f.cie || '') + (f.arr || '') + ' → ' + (f.cie || '') + (f.dep || '')) + '</b><span class="tag">' + esc(f.ap || '---') + '</span>'
    + (f.cx ? '<span class="st w">Annulé</span>' : '') + '<span class="sp" style="flex:1"></span>'
    + '<div class="seg"><button type="button" class="' + (f.open ? 'on' : '') + '" onclick="dSet(' + i + ',\'open\',true)">Onglet ouvert</button><button type="button" class="' + (f.open ? '' : 'on') + '" onclick="dSet(' + i + ',\'open\',false)">Dans la liste</button></div>'
    + '<button class="btn" type="button" aria-label="Monter" onclick="dMove(' + i + ',-1)"' + (i ? '' : ' disabled') + '>↑</button><button class="btn" type="button" aria-label="Descendre" onclick="dMove(' + i + ',1)"' + (i < fl.length - 1 ? '' : ' disabled') + '>↓</button><button class="btn d" type="button" aria-label="Retirer" onclick="dDel(' + i + ')">×</button></div>'
    + '<div class="dgrid">' + inp(i,'cie','Cie',70) + inp(i,'arr','N° arrivée',100) + inp(i,'dep','N° départ',100) + inp(i,'ap','Prov. / dest.',90) + inp(i,'reg','Immat',110) + inp(i,'type','Type',90) + inp(i,'park','Parking',80) + inp(i,'paf','PAF',70) + inp(i,'tat','Escale (min)',90) + '</div>'
    + '<div class="dgrid dt">' + inp(i,'sibt','SIBT',90,'-60') + inp(i,'aibt','AIBT',90,'auto') + inp(i,'sobt','SOBT',90,'auto') + inp(i,'ctot','CTOT',90,'aucun') + inp(i,'aobt','AOBT',90,'auto') + inp(i,'dl','Codes retard',140,'ex. 32 4, 77 4') + '</div>'
    + '<div class="dft"><div class="seg"><button type="button" class="' + (f.fill !== 'none' ? 'on' : '') + '" onclick="dSet(' + i + ',\'fill\',\'auto\')">Rempli comme un vrai vol</button><button type="button" class="' + (f.fill === 'none' ? 'on' : '') + '" onclick="dSet(' + i + ',\'fill\',\'none\')">Je saisis moi-même</button></div>'
    + '<label class="dcx"><input type="checkbox"' + (f.cx ? ' checked' : '') + ' onchange="dSet(' + i + ',\'cx\',this.checked)"> Annulé</label></div>'
    + '<div class="hint" id="dl-' + i + '" style="padding:8px 0 0">' + dLine(f, i) + '</div></div>').join('');
  return '<div class="hd"><div><h1>Vols de démo</h1><p>Le scénario que la démo rejoue à son lancement et quand on touche « Réinitialiser ». Les heures se donnent par rapport au lancement : <b>-20</b> = 20 min avant, <b>+15</b> = dans 15 min, <b>10:35</b> = heure exacte, <b>non</b> = pas encore (AIBT ou AOBT). Vide = calculé comme d\'habitude.</p></div><span class="sp"></span>'
   + (own ? '<button class="btn" type="button" onclick="dReset()">Scénario par défaut</button>' : '') + '<button class="btn p" type="button" onclick="dAdd()">+ Ajouter un vol</button></div>'
   + (own ? '' : '<div class="card"><div class="hint" style="padding:12px 16px">Voici le scénario par défaut. Modifiez n\'importe quel champ pour en faire le vôtre.</div></div>')
   + cards
   + '<p class="hint" style="padding:0">Après « Publier », rouvrez la démo : elle repart sur ce scénario. Entre deux réinitialisations, ce que vous saisissez dans l\'app reste en place.</p>';
}

/* Publication (v3.40) : jeton GitHub pour écrire config.json dans le repo de la démo */
function tokSave(){ const v = $('#ghTok').value.trim(); try{ v ? localStorage.setItem('ghToken', v) : localStorage.removeItem('ghToken'); }catch(e){} tokMsg = v ? 'Jeton enregistré dans ce navigateur.' : 'Jeton retiré.'; render(); }
let tokMsg = '';
async function tokTest(){
  tokMsg = 'Vérification…'; render();
  try{
    const tok = (localStorage.getItem('ghToken') || '').trim(); if(!tok) throw new Error('notoken');
    const r = await fetch('https://api.github.com/repos/' + GH.owner + '/' + GH.repo, { headers:{ Authorization:'Bearer ' + tok, Accept:'application/vnd.github+json' }, cache:'no-store' });
    if(!r.ok) throw new Error(String(r.status));
    const j = await r.json(); tokMsg = j.permissions && j.permissions.push === false ? 'Le jeton lit ' + GH.repo + ' mais ne peut pas y écrire : ajoutez le droit Contents en écriture.' : 'Jeton valide : la publication pour tout le monde est prête.';
  }catch(e){ tokMsg = 'Problème : ' + ghWhy(e) + '.'; }
  render();
}
function vPub(){
  const has = !!(localStorage.getItem('ghToken') || '').trim();
  return '<div class="hd"><div><h1>Publication</h1><p>« Publier » écrit vos réglages dans le fichier config.json du repo ' + esc(GH.owner + '/' + GH.repo) + '. Toute personne qui ouvre la démo les reçoit, en général 1 à 2 minutes après. Sans jeton, ils ne s\'appliquent que sur cet appareil.</p></div></div>'
   + '<div class="split"><div class="card"><h2>Jeton GitHub</h2><div class="form">'
   + '<div class="f"><label>Jeton (gardé seulement dans ce navigateur)</label><input id="ghTok" type="password" autocomplete="off" class="txt" value="' + (has ? '••••••••••••' : '') + '" onfocus="if(this.value.startsWith(\'•\'))this.value=\'\'" placeholder="github_pat_…"></div>'
   + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" type="button" onclick="tokSave()">Enregistrer</button><button class="btn" type="button" onclick="tokTest()"' + (has ? '' : ' disabled') + '>Vérifier</button>' + (has ? '<button class="btn d" type="button" onclick="$(\'#ghTok\').value=\'\';tokSave()">Retirer</button>' : '') + '</div>'
   + (tokMsg ? '<div class="hint" style="padding:0">' + esc(tokMsg) + '</div>' : '') + '</div></div>'
   + '<div class="card"><h2>Créer le jeton (une seule fois)</h2><ol class="hint" style="padding:8px 16px 14px 34px;line-height:1.6;margin:0">'
   + '<li>Ouvrez <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com › Fine-grained token</a>.</li>'
   + '<li>Repository access : <b>Only select repositories</b> → <b>' + esc(GH.repo) + '</b>.</li>'
   + '<li>Permissions › Repository › <b>Contents : Read and write</b>. Rien d\'autre.</li>'
   + '<li>Choisissez une expiration, générez, copiez le jeton et collez-le ici.</li></ol></div></div>';
}
