a.nav,a.btn{text-decoration:none}a.btn{display:inline-block}.btn:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}.me .back{font-size:12.5px}

<div class="app">

</div>
<script>
/* Admin compagnies (démo) : brouillon dans localStorage 'adminCfgDraft', publication dans 'adminCfg' que lit l'app (cfg.js). */
const ICONS = {
  plane:'<path d="M2 16l20-6-20-6 4 6-4 6z"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>', phone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/>',
  back:'<path d="M15 5l-7 7 7 7"/>'
};
const NAV = [['Exploitation'],['compagnies','Compagnies','plane'],['cibles','Temps d\'escale cibles','clock'],['ajout','Ajouter une compagnie','plus'],['Contrôle'],['apercu','Aperçu dans l\'app','phone']];
// Étapes que la timeline de l'app sait afficher (clé = action de renderTimeline)
const STEPS = {
  'Débarquement':'Débarquement', 'Cabin release':'Cabin tidy / cleaning', 'Avitair':'Avitaillement', 'Lift (Dep)':'Lift départ',
  'Embarquement':'Embarquement', 'ArrPNT':'Arrivée PNT', 'ArrPNC':'Arrivée PNC', 'RemiseLID':'LID / LDS-LDF',
  'FermeturePorteAvion':'Fermeture porte', 'ConnexionCasque':'Connexion casque', 'ArriveeINAD':'Arrivée INAD'
};
const POINTS = new Set(['ArrPNT','ArrPNC','RemiseLID','FermeturePorteAvion','ConnexionCasque','ArriveeINAD']);
const S = (k,a,b) => ({k, a, b: b || null});
const FR_ST = [S('ArrPNT',['EOBT',-45]),S('ArrPNC',['EOBT',-45]),S('Débarquement',['AIBT',2],['EOBT',-13]),S('Avitair',['EOBT',-25],['EOBT',-5]),

  S('RemiseLID',['EOBT',-5]),S('FermeturePorteAvion',['EOBT',-5])];
const W320 = [S('Débarquement',['EOBT',-27],['EOBT',-20]),S('Avitair',['EOBT',-27],['EOBT',-5]),S('Cabin release',['EOBT',-19],['EOBT',-15]),
  S('Embarquement',['EOBT',-14],['EOBT',-3]),S('RemiseLID',['EOBT',-7]),S('FermeturePorteAvion',['EOBT',-2])];
const W321 = [S('Débarquement',['EOBT',-32],['EOBT',-24]),S('Avitair',['EOBT',-32],['EOBT',-5]),S('Cabin release',['EOBT',-23],['EOBT',-18]),
  S('Embarquement',['EOBT',-17],['EOBT',-3]),S('RemiseLID',['EOBT',-9]),S('FermeturePorteAvion',['EOBT',-2])];
const V7S = [S('Débarquement',['EOBT',-28],['EOBT',-23]),S('Cabin release',['EOBT',-23],['EOBT',-21]),S('Embarquement',['EOBT',-20],['EOBT',-7]),S('FermeturePorteAvion',['EOBT',-5])];
const T = (mtt,crew,steps,like) => { const o = {mtt, crew}; if(steps) o.steps = steps; if(like) o.like = like; return o; };
const ryr = (n,icao) => ({n, icao, hle:60, types:{B737:T(25,35,FR_ST),B738:T(25,35,null,'B737'),B38M:T(25,35,null,'B737'),A320:T(25,35,null,'B737'),CL35:T(25,35,null,'B737')}});
const wzz = (n,icao) => ({n, icao, hle:40, types:{A320:T(30,null,W320),A321:T(35,null,W321),A20N:T(30,null,null,'A320'),A21N:T(35,null,null,'A321'),A21NY:T(35,null,null,'A321')}});
const hsk = n => ({n, icao:'', hle:40, types:{A319:T(null,null),A320:T(null,null),A321:T(null,null),A21N:T(null,null)}});
// Réglages d'origine = valeurs codées dans l'app (v3.35)
const DEFAULTS = JSON.parse(JSON.stringify({v:1, al:{
  FR:ryr('Ryanair','RYR'), RK:ryr('Ryanair UK','RUK'), W6:wzz('Wizz Air','WZZ'), W4:wzz('Wizz Air Malta','WMT'),
  V7:{n:'Volotea', icao:'VOE', hle:40, types:{A319:T(null,null,null,'A320'),A320:T(null,null,V7S)}},
  H4:hsk('HiSky'), H6:hsk('')
}}));
const RULES = {
  FR:[['Départ de BVA','L\'embarquement commence à EOBT −35.'],['Changement d\'équipage','Arrivée PNT ou PNC remplie : rotation mini « avec changement d\'équipage », cabin tidy jusqu\'au dernier débarqué +10 au lieu de +3.'],['Paper LID','LID 3 min avant la cible eLID.']],
  W6:[['A320 en Y186','Immatriculations connues en 186 sièges, sinon Y180.']]
};
RULES.RK = RULES.FR; RULES.W4 = RULES.W6;
const clone = o => JSON.parse(JSON.stringify(o));
const LS = { get(k){ try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; } }, set(k,v){ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const pubCfg = () => LS.get('adminCfg') || DEFAULTS;
let C = LS.get('adminCfgDraft') || clone(pubCfg());
let cur = 'compagnies', sel = 'W6', tab = 'types', ty = 'A320', wiz = 1, flash = '';
const W = {c:'', icao:'', n:'', from:'W6', types:[]};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const AL = c => C.al[c];
const stepsOf = (a,t) => { const x = a.types[t]; if(!x) return null; return x.steps || (x.like && a.types[x.like] && a.types[x.like].steps) || null; };
const sgn = v => (v > 0 ? '+' : '') + v;

function save(){ LS.set('adminCfgDraft', C); pubBar(); }
function dirty(){ return JSON.stringify(C) !== JSON.stringify(pubCfg()); }
function pubBar(){
  const d = dirty();
  $('#pubtxt').textContent = d ? 'Modifications pas encore publiées' : flash || (LS.get('adminCfg') ? 'Réglages publiés sur la démo' : 'Réglages d\'origine de l\'app');
  $('#pubBtn').disabled = !d; $('#undoBtn').hidden = !d;
}
function publish(){ LS.set('adminCfg', C); LS.set('adminCfgDraft', null); flash = 'Publié. La démo ouverte sur cet appareil utilise maintenant ces réglages.'; pubBar(); }
function undo(){ C = clone(pubCfg()); LS.set('adminCfgDraft', null); flash = ''; go(cur); }
function resetAll(){
  if(!confirm('Revenir aux réglages d\'origine de l\'app ? Les compagnies ajoutées et les cibles modifiées seront perdues.')) return;
  LS.set('adminCfg', null); LS.set('adminCfgDraft', null); C = clone(DEFAULTS); flash = 'Réglages d\'origine rétablis.'; go('compagnies');
}
function icon(k){ return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[k] + '</svg>'; }
function side(){
  let h = '<div class="brand"><i>T</i><div><b>Timing · Admin</b><small>Démo · Escale BVA</small></div></div>';
  NAV.forEach(n => { h += n.length === 1 ? '<div class="grp">' + n[0] + '</div>'
    : '<button type="button" class="nav' + (navOn(n[0]) ? ' on' : '') + '" onclick="go(\'' + n[0] + '\')">' + icon(n[2]) + n[1] + '</button>'; });
  h += '<a class="nav" href="./">' + icon('back') + 'Retour à l\'app</a>';
  h += '<div class="me"><button type="button" class="back" style="color:#D5DEF5" onclick="resetAll()">Revenir aux réglages d\'origine</button></div>';
  $('#side').innerHTML = h;
}
function navOn(k){ return k === 'cibles' ? (cur === 'fiche' && tab === 'cibles') : k === 'compagnies' ? (cur === 'compagnies' || (cur === 'fiche' && tab !== 'cibles')) : cur === k; }
function go(v, c, t){
  cur = v; if(c) sel = c; if(t) tab = t;
  if(v === 'cibles'){ cur = 'fiche'; tab = 'cibles'; }
  if(!AL(sel)) sel = Object.keys(C.al)[0];
  if(cur === 'fiche' && !AL(sel).types[ty]) ty = Object.keys(AL(sel).types)[0] || '';
  side(); render(); pubBar();
}
function render(){
  const v = $('#view'); v.innerHTML = ({compagnies:vList, fiche:vFiche, ajout:vAjout, apercu:vApercu})[cur]();
  v.classList.remove('view'); void v.offsetWidth; v.classList.add('view');
  if(cur === 'fiche' && tab === 'cibles') drawGantt();
}

/* Compagnies */
function vList(){
  let r = '';
  Object.entries(C.al).forEach(([c,a]) => {
    const ts = Object.keys(a.types), mt = [...new Set(ts.map(t => a.types[t].mtt).filter(v => v != null && v !== ''))];
    const nT = ts.filter(t => (stepsOf(a,t) || []).length).length;
    const st = ts.length && nT === ts.length ? '<span class="st ok">Complètes</span>' : nT ? '<span class="st w">' + nT + '/' + ts.length + ' types</span>' : '<span class="st m">Aucune</span>';
    r += '<tr onclick="go(\'fiche\',\'' + c + '\',\'types\')"><td><span class="code">' + c + '</span></td><td><b>' + (esc(a.n) || '<span style="color:var(--muted)">Sans nom</span>') + '</b>' + (a.icao ? '<br><small style="color:var(--muted);font-weight:600">Callsign ' + esc(a.icao) + '</small>' : '') + '</td><td>' + ts.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</td><td class="num">' + (mt.length ? mt.join(' / ') + ' min' : '<span style="color:var(--muted)">programme</span>') + '</td><td class="num">SOBT −' + a.hle + '</td><td>' + st + '</td></tr>';
  });
  return '<div class="hd"><div><h1>Compagnies</h1><p>Ce que la démo connaît de chaque compagnie. Touchez une ligne pour régler ses types avion, ses rotations minimales et ses temps d\'escale cibles.</p></div><span class="sp"></span><button class="btn p" type="button" onclick="wiz=1;go(\'ajout\')">+ Ajouter une compagnie</button></div>'
   + '<div class="card tw"><table><thead><tr><th>Code</th><th>Compagnie</th><th>Types avion</th><th>Rotation mini</th><th>Début HLE</th><th>Cibles timeline</th></tr></thead><tbody>' + r + '</tbody></table></div>'
   + '<p class="hint" style="padding:0">Rotation mini « programme » : l\'app garde la rotation prévue (SOBT − SIBT). Une compagnie absente de cette liste garde les règles de base de l\'app.</p>';
}

/* Fiche compagnie */
function vFiche(){
  const a = AL(sel);
  const tabs = [['general','Général'],['types','Types avion & rotations'],['cibles','Temps d\'escale cibles'],['regles','Règles particulières']];
  return '<button class="back" type="button" onclick="go(\'compagnies\')">← Compagnies</button>'
   + '<div class="hd"><div class="idc"><span class="code">' + sel + '</span><div><h1>' + (esc(a.n) || sel) + '</h1><p style="margin:2px 0 0">' + (a.icao ? 'Callsign ' + esc(a.icao) + ' · ' : '') + Object.keys(a.types).length + ' types avion</p></div></div><span class="sp"></span><div class="chips">' + Object.keys(C.al).map(x => '<button type="button" class="chip' + (x === sel ? ' on' : '') + '" onclick="go(\'fiche\',\'' + x + '\')">' + x + '</button>').join('') + '</div></div>'
   + '<div class="tabs" role="tablist">' + tabs.map(t => '<button type="button" role="tab" class="' + (tab === t[0] ? 'on' : '') + '" onclick="go(\'fiche\',null,\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</div>'
   + ({general:tGen, types:tTypes, cibles:tCibles, regles:tRegles})[tab](a);
}
function setA(k, v){ AL(sel)[k] = v; save(); }
function tGen(a){
  const hles = [30,40,45,50,60,75,90]; if(!hles.includes(+a.hle)) hles.push(+a.hle);
  return '<div class="card" style="max-width:640px"><h2>Identité</h2><div class="form">'
   + '<div class="row2"><div class="f"><label>Code IATA</label><input value="' + sel + '" disabled><small>Le code ne se change pas : créez une nouvelle compagnie au besoin.</small></div>'

   + '<div class="f"><label>Nom affiché</label><input value="' + esc(a.n) + '" oninput="setA(\'n\',this.value)"></div>'
   + '<div class="f"><label>Début HLE (vols sans arrivée)</label><select onchange="setA(\'hle\',+this.value)">' + hles.sort((x,y) => x-y).map(v => '<option value="' + v + '"' + (v === +a.hle ? ' selected' : '') + '>SOBT −' + v + ' min</option>').join('') + '</select><small>Heure HLE du bloc Timing, et départ de la barre de progression quand l\'avion part de BVA.</small></div>'
   + (DEFAULTS.al[sel] ? '' : '<div class="rule" style="padding:10px 0 0"><button class="btn d" type="button" onclick="delAl()">Supprimer cette compagnie</button></div>')
   + '</div></div>';
}
function delAl(){ if(!confirm('Supprimer ' + sel + ' ?')) return; delete C.al[sel]; save(); go('compagnies'); }
function setT(t, k, el){
  const x = AL(sel).types[t], v = el.value.trim();
  x[k] = v === '' ? null : Math.max(0, parseInt(v, 10) || 0); el.classList.add('ch'); save();
}
function setLike(t, v){
  const a = AL(sel), x = a.types[t];
  if(v === '__own'){ x.steps = clone(stepsOf(a,t) || []); delete x.like; }
  else if(v === '__none'){ delete x.steps; delete x.like; }
  else { delete x.steps; x.like = v; Object.values(a.types).forEach(y => { if(y.like === t) y.like = v; }); }
  save(); render();
}
function addType(){
  const el = $('#newType'), t = (el.value || '').toUpperCase().replace(/\s/g, ''); const a = AL(sel);
  if(!t || a.types[t]) { el.focus(); return; }
  const first = Object.keys(a.types)[0], f = first ? a.types[first] : null;
  a.types[t] = f ? {mtt:f.mtt, crew:f.crew, like: f.steps ? first : f.like} : {mtt:null, crew:null};
  if(a.types[t].like == null) delete a.types[t].like;
  save(); render();
}
function delType(t){
  const a = AL(sel); if(Object.keys(a.types).length < 2) return;
  if(!confirm('Retirer ' + t + ' de ' + sel + ' ?')) return;
  const own = a.types[t].steps; delete a.types[t];
  Object.values(a.types).forEach(y => { if(y.like === t){ delete y.like; if(own) y.steps = clone(own); } });
  save(); render();
}
function tTypes(a){
  const ts = Object.keys(a.types); let r = '';
  ts.forEach(t => {
    const x = a.types[t];
    const opts = '<option value="__own"' + (x.steps ? ' selected' : '') + '>Cibles propres</option>'
      + ts.filter(o => o !== t && a.types[o].steps).map(o => '<option value="' + o + '"' + (x.like === o ? ' selected' : '') + '>Comme ' + o + '</option>').join('')
      + '<option value="__none"' + (!x.steps && !x.like ? ' selected' : '') + '>Aucune cible</option>';
    r += '<tr style="cursor:default"><td><b>' + esc(t) + '</b>' + (t === ts[0] ? '<br><small style="color:var(--muted);font-weight:600">par défaut</small>' : '') + '</td>'
      + '<td><input class="mini" inputmode="numeric" value="' + (x.mtt ?? '') + '" placeholder="—" oninput="setT(\'' + t + '\',\'mtt\',this)"><span class="u">min</span></td>'
      + '<td><input class="mini" inputmode="numeric" value="' + (x.crew ?? '') + '" placeholder="—" oninput="setT(\'' + t + '\',\'crew\',this)"><span class="u">min</span></td>'
      + '<td><select class="refsel" onchange="setLike(\'' + t + '\',this.value)">' + opts + '</select></td>'
      + '<td style="white-space:nowrap"><button class="btn" type="button" onclick="ty=\'' + t + '\';go(\'fiche\',null,\'cibles\')">Cibles</button> ' + (ts.length > 1 ? '<button class="btn d" type="button" aria-label="Retirer ' + t + '" onclick="delType(\'' + t + '\')">×</button>' : '') + '</td></tr>';
  });
  return '<div class="card tw"><table><thead><tr><th>Type</th><th>Rotation mini</th><th>Avec changement d\'équipage</th><th>Timeline cible</th><th></th></tr></thead><tbody>' + r + '</tbody></table>'
   + '<div class="rule" style="flex-wrap:wrap;align-items:center"><input id="newType" class="mini" style="width:96px;text-transform:uppercase" maxlength="6" placeholder="A21N" onkeydown="if(event.key===\'Enter\')addType()"><button class="chip add" type="button" onclick="addType()">+ Ajouter un type</button>'
   + '<span style="color:var(--muted);flex-basis:100%">EOBT = max(SOBT, AIBT + rotation mini). Rotation vide : rotation prévue au programme. Changement d\'équipage vide : même rotation. Un type absent de la liste prend les réglages du type par défaut.</span></div></div>';
}
function tCibles(a){
  const ts = Object.keys(a.types);
  if(!ts.length) return '<div class="card"><div class="hint" style="padding-top:14px">Ajoutez d\'abord un type avion.</div></div>';
  const x = a.types[ty], steps = stepsOf(a, ty);
  let h = '<div class="card"><h2>Type avion</h2><div class="typecards">' + ts.map(t => { const y = a.types[t]; return '<div class="tc' + (t === ty ? ' on' : '') + '" role="button" tabindex="0" onclick="ty=\'' + t + '\';go(\'fiche\')"><b>' + esc(t) + '</b><small>' + (y.mtt ? y.mtt + ' min mini · ' : '') + (y.steps ? 'cibles propres' : y.like ? 'comme ' + y.like : 'aucune cible') + '</small></div>'; }).join('') + '</div></div>';
  if(!steps){
    const srcs = []; Object.entries(C.al).forEach(([c,b]) => Object.keys(b.types).forEach(t => { if(b.types[t].steps && b.types[t].steps.length) srcs.push(c + ' ' + t); }));
    return h + '<div class="card"><div class="drop" style="margin:16px"><b>Pas de cibles pour ' + sel + ' ' + esc(ty) + '</b><br>La timeline n\'affiche alors que les heures réelles.<br><br>'
      + '<select class="refsel" id="srcSel">' + srcs.map(s => '<option' + (s === 'W6 A320' ? ' selected' : '') + '>' + s + '</option>').join('') + '</select> <button class="btn p" type="button" onclick="copyFrom($(\'#srcSel\').value)">Copier ces cibles</button> <button class="btn" type="button" onclick="copyFrom(null)">Partir de zéro</button></div></div>';
  }
  const ref = (i,k,r) => '<select class="refsel" aria-label="Référence" onchange="setRef(' + i + ',\'' + k + '\',this.value)">' + ['AIBT','EOBT'].map(v => '<option' + (v === r ? ' selected' : '') + '>' + v + '</option>').join('') + '</select>';
  const off = (i,k,v) => '<input class="mini" inputmode="numeric" aria-label="Minutes" value="' + sgn(v) + '" oninput="setOff(' + i + ',\'' + k + '\',this)">';
  let r = '';
  steps.forEach((s,i) => {
    r += '<tr style="cursor:default"><td><b>' + esc(STEPS[s.k] || s.k) + '</b></td><td class="d" data-l="Début" style="white-space:nowrap">' + ref(i,'a',s.a[0]) + ' ' + off(i,'a',s.a[1]) + '</td><td class="d" data-l="Fin" style="white-space:nowrap">' + (s.b ? ref(i,'b',s.b[0]) + ' ' + off(i,'b',s.b[1]) : '<span class="tag">jalon</span>') + '</td><td><button class="btn d" type="button" aria-label="Retirer" onclick="delStep(' + i + ')">×</button></td></tr>';
  });
  const left = Object.keys(STEPS).filter(k => !steps.some(s => s.k === k));
  const mtt = x.mtt || 30;
  h += '<div class="split"><div class="card tw"><h2>' + sel + ' ' + esc(ty) + ' : étapes et cibles' + (x.steps ? '' : ' <span class="inh ov">(celles de ' + x.like + ')</span>') + '</h2>'
   + (x.steps ? '' : '<div class="hint" style="padding-top:8px">Modifier une valeur donne à ' + esc(ty) + ' ses propres cibles ; ' + x.like + ' ne change pas.</div>')
   + '<table class="stp"><thead><tr><th>Étape</th><th>Début</th><th>Fin</th><th></th></tr></thead><tbody>' + r + '</tbody></table>'
   + (left.length ? '<div class="rule" style="align-items:center"><select class="refsel" id="newStep">' + left.map(k => '<option value="' + k + '">' + STEPS[k] + '</option>').join('') + '</select><button class="chip add" type="button" onclick="addStep($(\'#newStep\').value)">+ Ajouter l\'étape</button></div>' : '')
   + '<div class="hint" style="padding-top:10px">Cabin : la cible démarre au dernier débarqué réel dès qu\'il est saisi.</div></div>'
   + '<div class="card"><h2>Aperçu de la timeline</h2><div class="hint" style="padding-top:6px">Avion à l\'heure, rotation de ' + mtt + ' min : AIBT = EOBT −' + mtt + '. Se met à jour pendant la saisie.</div><div class="gantt" id="gantt"></div></div></div>';
  return h;
}
function editable(){ const a = AL(sel), x = a.types[ty]; if(!x.steps){ x.steps = clone(stepsOf(a,ty) || []); delete x.like; } return x.steps; }
function setOff(i,k,el){ const v = parseInt(el.value.replace(/[−–]/g,'-'), 10); if(isNaN(v)) return; const st = editable(); st[i][k][1] = v; el.classList.add('ch'); save(); drawGantt(); syncHead(); }
function setRef(i,k,v){ editable()[i][k][0] = v; save(); render(); }
function delStep(i){ editable().splice(i,1); save(); render(); }
function addStep(k){ editable().push(POINTS.has(k) ? S(k,['EOBT',-10]) : S(k,['EOBT',-20],['EOBT',-10])); save(); render(); }
function copyFrom(src){
  const x = AL(sel).types[ty]; delete x.like;
  if(src){ const [c,t] = src.split(' '); x.steps = clone(C.al[c].types[t].steps); }
  else x.steps = [S('Débarquement',['AIBT',2],['EOBT',-20]),S('Embarquement',['EOBT',-15],['EOBT',-5]),S('FermeturePorteAvion',['EOBT',-3])];
  save(); render();
}
function syncHead(){ const h = document.querySelector('.split .card.tw h2'); if(h && AL(sel).types[ty].steps) h.innerHTML = sel + ' ' + esc(ty) + ' : étapes et cibles'; }
function ganttHTML(st, mtt, cls){
  const abs = p => p[0] === 'AIBT' ? -mtt + p[1] : p[1];   // minutes par rapport à EOBT
  const lo = Math.min(-mtt - 5, ...st.map(s => abs(s.a)), ...st.filter(s => s.b).map(s => abs(s.b))) - 2;
  const hi = Math.max(5, ...st.map(s => abs(s.b || s.a)) .map(v => v + 3)), Wd = hi - lo, pc = m => ((m - lo) / Wd * 100).toFixed(2) + '%';
  return {abs, lo, hi, Wd, pc};
}
function drawGantt(){
  const g = $('#gantt'); if(!g) return;
  const a = AL(sel), x = a.types[ty], st = stepsOf(a,ty) || [], mtt = x.mtt || 30;
  const {abs, lo, hi, Wd, pc} = ganttHTML(st, mtt);
  let ax = ''; for(let m = Math.ceil(lo / 10) * 10; m <= hi; m += 10) ax += '<span style="left:' + pc(m) + '">' + (m === 0 ? 'EOBT' : m) + '</span>';
  let h = '<div class="gx">' + ax + '</div>';
  st.forEach(s => {
    const s0 = abs(s.a), s1 = s.b ? abs(s.b) : s0, bad = s.b && s1 < s0;
    h += '<div class="gr"><div class="gl" title="' + esc(STEPS[s.k] || s.k) + '">' + esc(STEPS[s.k] || s.k) + '</div><div class="gt"><span class="gline" style="left:' + pc(-mtt) + '"></span><span class="gline e" style="left:' + pc(0) + '"></span><span class="gb' + (s.b ? '' : ' pt') + '" style="left:' + pc(Math.min(s0,s1)) + ';width:' + (Math.abs(s1 - s0) / Wd * 100).toFixed(2) + '%' + (bad ? ';background:var(--bad)' : '') + '"></span></div></div>';
  });
  h += '<div class="gr"><div class="gl"></div><div class="gt"><span class="gcap" style="left:' + pc(-mtt) + ';color:var(--muted)">AIBT</span><span class="gcap" style="left:' + pc(0) + ';color:var(--bad)">EOBT</span></div></div>';
  if(st.some(s => s.b && abs(s.b) < abs(s.a))) h += '<div class="hint" style="padding:6px 0 0;color:var(--bad)">Une étape finit avant de commencer (en rouge).</div>';
  g.innerHTML = h;
}
function tRegles(a){
  const rs = RULES[sel] || [];
  return '<div class="card"><h2>Règles appliquées par l\'app</h2><div class="hint" style="padding-top:6px">Elles s\'ajoutent aux cibles selon la situation du vol. Elles restent dans le code de l\'app pour l\'instant ; seules les valeurs des autres onglets se règlent ici.</div>'
   + (rs.length ? rs.map(r => '<div class="rule"><span class="tag">Si</span><div><b>' + esc(r[0]) + '</b><br><span style="color:var(--muted)">' + esc(r[1]) + '</span></div></div>').join('') : '<div class="rule" style="color:var(--muted)">Aucune règle particulière pour ' + sel + '.</div>')
   + '</div>';
}

/* Ajout d'une compagnie */
const ALL_TYPES = ['A319','A320','A20N','A321','A21N','A21NY','B737','B738','B38M','BCS3','CL35','E190','E195','AT76'];
function vAjout(){
  const steps = ['Identité','Types avion','Récapitulatif'];
  let h = '<div class="hd"><div><h1>Ajouter une compagnie</h1><p>Le plus rapide : partir d\'une compagnie qui ressemble, puis ajuster dans sa fiche.</p></div></div>'
   + '<div class="card" style="max-width:760px"><div class="steps">' + steps.map((s,i) => '<span class="' + (i + 1 === wiz ? 'on' : i + 1 < wiz ? 'dn' : '') + '">' + (i + 1) + '. ' + s + '</span>').join('') + '</div>';
  if(wiz === 1) h += '<div class="form"><div class="row2"><div class="f"><label>Code IATA</label><input id="wc" value="' + esc(W.c) + '" placeholder="ex. U2" maxlength="3" style="text-transform:uppercase"></div><div class="f"><label>Préfixe callsign (OACI)</label><input id="wi" value="' + esc(W.icao) + '" placeholder="ex. EZY" maxlength="3" style="text-transform:uppercase"></div></div><div class="f"><label>Nom affiché</label><input id="wn" value="' + esc(W.n) + '" placeholder="ex. easyJet"></div><div class="f"><label>Partir de</label><div class="chips">' + Object.keys(C.al).map(c => '<button type="button" class="chip' + (W.from === c ? ' on' : '') + '" onclick="saveW();W.from=\'' + c + '\';W.types=[];render()">' + c + '</button>').join('') + '<button type="button" class="chip' + (W.from === '' ? ' on' : '') + '" onclick="saveW();W.from=\'\';W.types=[];render()">Vide</button></div><small>Copie les types, rotations, HLE et cibles. Rien ne reste lié ensuite.</small></div><div class="hint" id="werr" style="padding:0;color:var(--bad)"></div></div>';
  if(wiz === 2){
    const src = W.from && AL(W.from), list = [...new Set([...(src ? Object.keys(src.types) : []), ...ALL_TYPES])];
    h += '<div class="form"><div class="f"><label>Types exploités</label><div class="chips">' + list.map(t => '<button type="button" class="chip' + (W.types.includes(t) ? ' on' : '') + '" onclick="togT(\'' + t + '\')">' + t + '</button>').join('') + '</div><small>Le premier choisi sert de type par défaut.</small></div></div>';
  }
  if(wiz === 3){
    const src = W.from && AL(W.from);
    h += '<div class="form"><div class="rule" style="border:1px solid var(--line);border-radius:10px"><span class="code">' + esc(W.c) + '</span><div><b>' + esc(W.n || W.c) + '</b><br><span style="color:var(--muted)">' + (W.icao ? 'Callsign ' + esc(W.icao) + ' · ' : '') + 'HLE SOBT −' + (src ? src.hle : 40) + '</span></div></div>'
      + W.types.map(t => { const s = src && src.types[t], st = src && stepsOf(src,t); return '<div class="rule" style="border:1px solid var(--line);border-radius:10px"><b style="width:64px">' + t + '</b><span style="flex:1;color:var(--muted)">' + (s && s.mtt ? s.mtt + ' min mini · ' : 'rotation du programme · ') + (st && st.length ? st.length + ' étapes copiées de ' + W.from + ' ' + t : 'aucune cible') + '</span></div>'; }).join('')
      + '<small style="color:var(--muted)">Tout se modifie ensuite dans la fiche de la compagnie.</small></div>';
  }
  h += '<div class="rule" style="justify-content:flex-end">' + (wiz > 1 ? '<button class="btn" type="button" onclick="saveW();wiz--;render()">Retour</button>' : '') + (wiz < 3 ? '<button class="btn p" type="button" onclick="next()">Continuer</button>' : '<button class="btn p" type="button" onclick="addAl()">Créer la compagnie</button>') + '</div></div>';
  return h;
}
function saveW(){ if($('#wc')){ W.c = $('#wc').value.toUpperCase().trim(); W.icao = $('#wi').value.toUpperCase().trim(); W.n = $('#wn').value.trim(); } }
function next(){
  saveW();
  if(wiz === 1){
    const e = !/^[A-Z0-9]{2,3}$/.test(W.c) ? 'Le code IATA fait 2 ou 3 caractères.' : C.al[W.c] ? W.c + ' existe déjà.' : W.icao && !/^[A-Z]{3}$/.test(W.icao) ? 'Le préfixe callsign fait 3 lettres.' : '';
    if(e){ $('#werr').textContent = e; return; }
    if(!W.types.length) W.types = W.from ? Object.keys(AL(W.from).types) : ['A320'];
  }
  if(wiz === 2 && !W.types.length) return;
  wiz++; render();
}
function togT(t){ const i = W.types.indexOf(t); i < 0 ? W.types.push(t) : W.types.splice(i,1); render(); }
function addAl(){
  const src = W.from && AL(W.from), types = {};
  W.types.forEach(t => {
    const s = src && src.types[t], st = src && stepsOf(src,t);
    types[t] = {mtt: s ? s.mtt : null, crew: s ? s.crew : null}; if(st && st.length) types[t].steps = clone(st);
  });
  C.al[W.c] = {n: W.n, icao: W.icao, hle: src ? src.hle : 40, types};
  save(); const c = W.c; Object.assign(W, {c:'', icao:'', n:'', from:'W6', types:[]}); wiz = 1; ty = Object.keys(types)[0]; go('fiche', c, 'types');
}

/* Aperçu côté app */
let pv = {c:'W6', t:'A321'};
function vApercu(){
  if(!AL(pv.c)) pv.c = Object.keys(C.al)[0];
  const a = AL(pv.c); if(!a.types[pv.t]) pv.t = Object.keys(a.types)[0];
  const x = a.types[pv.t] || {}, st = stepsOf(a, pv.t) || [], mtt = x.mtt || 30;
  const {abs, Wd, pc} = ganttHTML(st, mtt);
  const eobt = 630, hm = m => { m = (m + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2,'0') + ':' + String(m % 60).padStart(2,'0'); };
  const at = p => hm(eobt + abs(p));
  const rows = st.map(s => { const s0 = abs(s.a), s1 = s.b ? abs(s.b) : s0; return '<div class="r"><i>' + esc(STEPS[s.k] || s.k) + '</i><em><b class="' + (s.b ? '' : 'pt') + '" style="left:' + pc(Math.min(s0,s1)) + ';width:' + (Math.abs(s1 - s0) / Wd * 100).toFixed(1) + '%"></b><span class="now" style="left:' + pc(-12) + '"></span></em></div>'; }).join('') || '<div style="font-size:11px;color:#6B7799;padding:8px 0">Pas de cibles : heures réelles seulement.</div>';
  const tbl = st.map(s => '<tr style="cursor:default"><td>' + esc(STEPS[s.k] || s.k) + '</td><td class="num">' + at(s.a) + (s.b ? ' → ' + at(s.b) : '') + '</td></tr>').join('');
  return '<div class="hd"><div><h1>Aperçu dans l\'app</h1><p>Vol à l\'heure, EOBT 10:30 : les cibles que l\'agent verra dans la timeline une fois publié.</p></div></div>'
   + '<div class="split"><div class="card"><h2>Vol d\'exemple</h2><div class="form"><div class="f"><label>Compagnie</label><div class="chips">' + Object.keys(C.al).map(c => '<button type="button" class="chip' + (c === pv.c ? ' on' : '') + '" onclick="pv.c=\'' + c + '\';render()">' + c + '</button>').join('') + '</div></div><div class="f"><label>Type avion</label><div class="chips">' + Object.keys(a.types).map(t => '<button type="button" class="chip' + (t === pv.t ? ' on' : '') + '" onclick="pv.t=\'' + t + '\';render()">' + t + '</button>').join('') + '</div></div>'
   + '<table><tbody><tr style="cursor:default"><td>AIBT</td><td class="num">' + hm(eobt - mtt) + '</td></tr><tr style="cursor:default"><td>EOBT</td><td class="num">' + hm(eobt) + (x.mtt ? ' <span class="u">AIBT + ' + mtt + ' min</span>' : '') + '</td></tr><tr style="cursor:default"><td>HLE</td><td class="num">' + hm(eobt - a.hle) + '</td></tr>' + tbl + '</tbody></table></div></div>'
   + '<div class="card" style="padding:16px"><div class="phone"><div class="ph-top"><span>' + pv.c + ' 1234 · ' + esc(pv.t) + '</span><span>' + hm(eobt - 12) + '</span></div><div class="ph-item"><small>Timeline · Départ</small><b>EOBT ' + hm(eobt) + '</b></div><div class="ph-tl">' + rows + '</div></div><p class="hint" style="padding:12px 0 0;text-align:center">Après « Publier », rouvrez la démo pour voir ces cibles sur un vol ' + pv.c + '.</p></div></div>';
}

/* Accès : connexion faite dans la démo aujourd'hui (même clé que l'app) */
function authed(){ try{ const o = JSON.parse(localStorage.getItem('pv_auth') || 'null'); return sessionStorage.getItem('pv_auth') === '1' || (o && o.h && new Date(o.t - 3*36e5).toDateString() === new Date(Date.now() - 3*36e5).toDateString()); }catch(e){ return false; } }
if(!authed()){
  document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:16px"><div class="card" style="padding:24px;max-width:400px;text-align:center"><h1 style="margin:0 0 8px;font-size:20px">Admin compagnies</h1><p class="hint" style="padding:0 0 16px">Connectez-vous d\'abord dans la démo, puis revenez par le menu « Admin compagnies ».</p><a class="btn p" href="./">Ouvrir la démo</a></div></div>';
} else { go('compagnies'); }
</script></body></html>
