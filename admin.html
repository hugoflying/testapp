  const head = '<div class="hd"><div><h1>Vols de démo</h1><p>Le scénario que la démo rejoue à son lancement et quand on touche « Réinitialiser ». Heures : <b>10:35</b> = heure exacte (les heures prévues SIBT et SOBT tombent toujours sur 0 ou 5, et la SOBT respecte la rotation mini), <b>-20</b> = 20 min avant le lancement, <b>+15</b> = 15 min après, <b>non</b> = pas encore (AIBT ou AOBT).</p></div><span class="sp"></span>'
   + '<div class="seg" title="Même réglage que dans l\'app"><button type="button" class="' + (dUTC() ? '' : 'on') + '" onclick="dTz(false)">LT</button><button type="button" class="' + (dUTC() ? 'on' : '') + '" onclick="dTz(true)">UTC</button></div>'
   + (own ? '<button class="btn" type="button" onclick="dReset()">Scénario par défaut</button>' : '') + '<button class="btn p" type="button" onclick="dAdd();dSel=dfl().length-1;render()">+ Ajouter un vol</button></div>';
  if(!f) return head;
  const st = dState(f, i), c = dCalc(f, i), tabs = [['vol','Vol & heures'],['arr','Arrivée'],['dep','Départ'],['ev','Événements'],['load','Load & fuel'],['notes','Notes']];
  let body;
  if(dTab === 'vol') body = '<div class="dgrid">' + inp('cie','Compagnie') + inp('arr','N° arrivée') + inp('dep','N° départ') + inp('ap','Prov. / dest.') + inp('reg','Immat') + inp('type','Type') + inp('park','Stand') + inp('paf','PAF') + inp('tat','Escale (min)') + '</div>'
    + '<div class="dgrid dt dtt">' + inp('sibt','SIBT','-60') + inp('aibt','AIBT',cc(c).A) + inp('sobt','SOBT',cc(c).D) + inp('ctot','CTOT',cc(c).ctot) + inp('aobt','AOBT',cc(c).off) + inp('dl','Codes retard','ex. 32 4, 77 4') + '</div>'
    + '<div class="dft"><span class="mut">Remplissage</span><div class="seg"><button type="button" class="' + (f.fill !== 'none' ? 'on' : '') + '" onclick="dSet(' + i + ',\'fill\',\'auto\')">Comme un vrai vol</button><button type="button" class="' + (f.fill === 'none' ? 'on' : '') + '" onclick="dSet(' + i + ',\'fill\',\'none\')">Je saisis moi-même</button></div>'
    + '<label class="dcx"><input type="checkbox"' + (f.cx ? ' checked' : '') + ' onchange="dSet(' + i + ',\'cx\',this.checked)"> Vol annulé</label></div>'
    + '<div class="hint" id="dl-' + i + '" style="padding:10px 0 0">' + dLine(f, i) + '</div>';
  else body = dDetails(f, i, dTab);
  return head + dFrise(fl)
   + '<div class="card dcard"><div class="dhd"><span class="code">' + esc(f.cie || '?') + '</span><b style="font-size:16px">' + esc((f.cie || '') + (f.arr || '') + ' → ' + (f.cie || '') + (f.dep || '')) + '</b><span class="tag">' + esc(f.ap || '---') + '</span><span class="st ' + (st[1] === 'ok' ? 'ok' : st[1] === 'bad' ? 'w' : 'm') + '">' + st[0] + '</span><span class="sp" style="flex:1"></span>'
   + '<div class="seg"><button type="button" class="' + (f.open ? 'on' : '') + '" onclick="dSet(' + i + ',\'open\',true)">Onglet ouvert</button><button type="button" class="' + (f.open ? '' : 'on') + '" onclick="dSet(' + i + ',\'open\',false)">Dans « Ouvrir un vol »</button></div>'
   + '<button class="btn" type="button" aria-label="Monter" onclick="dMove(' + i + ',-1);dSel=Math.max(0,dSel-1);render()"' + (i ? '' : ' disabled') + '>↑</button><button class="btn" type="button" aria-label="Descendre" onclick="dMove(' + i + ',1);dSel=Math.min(dfl().length-1,dSel+1);render()"' + (i < fl.length - 1 ? '' : ' disabled') + '>↓</button>'
   + '<button class="btn" type="button" onclick="dDup(' + i + ')">Dupliquer</button><button class="btn d" type="button" onclick="dDel(' + i + ')">Retirer</button></div>'
   + '<div class="tabs" role="tablist">' + tabs.map(([k, t]) => '<button type="button" role="tab" class="' + (dTab === k ? 'on' : '') + '" onclick="dTab=\'' + k + '\';render()">' + t + (k !== 'vol' && dCountPart(f, k) ? ' <span class="tag">' + dCountPart(f, k) + '</span>' : '') + '</button>').join('') + '</div>'
   + '<div style="padding-top:14px">' + body + '</div></div>'
   + '<p class="hint" style="padding:0">Après « Publier », rouvrez la démo : elle repart sur ce scénario. Entre deux réinitialisations, ce que vous saisissez dans l\'app reste en place.</p>';
}
function dCountPart(f, k){
  const ids = { arr:DT_ARR, dep:DT_DEP }[k];
  if(ids) return ids.filter(([id]) => (f.tm || {})[id]).length;
  if(k === 'ev') return (f.evs || []).length;
  if(k === 'load') return Object.keys(f.val || {}).length;
  if(k === 'notes') return String(f.notes || '').trim() ? String(f.notes).trim().split('\n').length : 0;
  return 0;
}
/* Publication (v3.46) : code admin + historique des publications gardé sur Cloudflare (30 dernières), retour à une version en un clic */
let hist = null, histErr = '', codeMsg = '';
function codeSave(){ const v = $('#admCode').value.trim(); try{ v ? localStorage.setItem('adminCode', v) : localStorage.removeItem('adminCode'); }catch(e){}
  codeMsg = v ? '' : 'Code oublié sur cet appareil.'; hist = null; histErr = ''; if(v) histLoad(); else render(); }
async function histLoad(){
  histErr = ''; codeMsg = 'Vérification…'; render();
  try{ hist = (await cfCall('GET')).hist; codeMsg = '✓ Code accepté sur cet appareil. Les 30 dernières versions sont gardées.'; }
  catch(e){ hist = null; codeMsg = ''; histErr = cfWhy(e); }
  if(cur === 'publication') render();
}
const dhm = t => { const d = new Date(+t); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
async function rollback(id){
  const h = (hist || []).find(x => x.id === id); if(!h) return;
  if(!confirm('Remettre en ligne la version du ' + dhm(h.at) + ' (' + h.sum + ') ? Elle remplace les réglages actuels pour tout le monde.')) return;
  busy = true; pubBar();
  try{ const j = await cfCall('POST', { rollback:id, label:dhm(h.at), dev:devName() }); hist = j.hist;
    try{ localStorage.setItem('adminCfgRemote', JSON.stringify(j.cfg)); }catch(e){}
    LS.set('adminCfg', null); LS.set('adminCfgDraft', null); C = clone(pubCfg()); flash = 'Version du ' + dhm(h.at) + ' remise en ligne pour tout le monde.'; }
  catch(e){ flash = 'Retour impossible : ' + cfWhy(e) + '.'; }
  busy = false; pubBar(); render();
}
function vPub(){
  const has = !!adminCode();
  if(has && hist == null && !histErr && !codeMsg) setTimeout(histLoad);
  const rows = (hist || []).map((h, i) => '<tr style="cursor:default"><td class="num">' + dhm(h.at) + '</td><td>' + esc(h.dev || '—') + '</td><td>' + esc(h.sum || '—') + '</td><td style="text-align:right">'
    + (i === 0 ? '<span class="tag" style="background:#E7F6EC;border-color:#BFE5CB;color:#1E7B3C">En ligne</span>' : '<button class="btn" type="button" onclick="rollback(\'' + esc(h.id) + '\')"' + (busy ? ' disabled' : '') + '>Revenir à cette version</button>') + '</td></tr>').join('');
  const body = !has ? '<p class="hint">Enregistrez le code admin pour voir l\'historique.</p>'
    : histErr ? '<p class="hint">Historique indisponible : ' + esc(histErr) + '.</p>'
    : hist == null ? '<p class="hint">Chargement…</p>'
    : !hist.length ? '<p class="hint">Aucune publication sur Cloudflare pour l\'instant. La prochaine apparaîtra ici.</p>'
    : '<table><thead><tr><th>Date</th><th>Appareil</th><th>Changements</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
  return '<div class="hd"><div><h1>Publication</h1><p>Chaque « Publier » garde une version sur Cloudflare. L\'app reçoit la dernière en moins d\'une minute, et vous pouvez revenir à une version précédente en un clic.</p></div></div>'
   + '<div class="split"><div class="card tw"><h2>Historique des publications</h2>' + body + '</div>'
   + '<div class="card"><h2>Code admin</h2><div class="form">'
   + '<div class="f"><label>Code admin (gardé seulement dans ce navigateur)</label><input id="admCode" type="password" autocomplete="off" class="txt" value="' + (has ? '••••••' : '') + '" onfocus="if(this.value.startsWith(\'•\'))this.value=\'\'" onkeydown="if(event.key===\'Enter\')codeSave()"></div>'
   + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" type="button" onclick="codeSave()">Enregistrer</button>' + (has ? '<button class="btn d" type="button" onclick="$(\'#admCode\').value=\'\';codeSave()">Oublier sur cet appareil</button>' : '') + '</div>'
   + (codeMsg ? '<div class="hint" style="padding:0">' + esc(codeMsg) + '</div>' : '') + '</div></div></div>';
}
</script></body></html>
